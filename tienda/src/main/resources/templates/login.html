<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Angel's Beauty & Cosmetics</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<!-- Navegación Superior -->
<nav class="navbar">
    <a th:href="@{/}" class="logo">Angel's Beauty</a>
    <ul class="nav-links">
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/nosotros}">Nosotros</a></li>
        <li><a th:href="@{/ofertas}">Ofertas</a></li>

        <li class="dropdown">
            <a href="javascript:void(0)" class="dropbtn">Contacto ▾</a>
            <div class="dropdown-content">
                <a href="https://wa.me/5219611234567" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">📸 Instagram</a>
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">📘 Facebook</a>
            </div>
        </li>
    </ul>

    <div style="display: flex; gap: 15px; align-items: center;">
        <a th:href="@{/carrito}" class="login-icon" style="text-decoration: none;" title="Ver Carrito">🛒</a>
        <a th:href="@{/login}" class="login-icon" style="text-decoration: none;" title="Iniciar Sesión">👤</a>
    </div>
</nav>

<!-- Formulario de Inicio de Sesión -->
<section style="max-width: 420px; margin: 70px auto; padding: 35px; border: 1px solid #eee; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center;">
    <h2 style="margin-bottom: 10px; color: #FF1694;">Iniciar Sesión</h2>
    <p style="margin-bottom: 25px; color: #666;">Bienvenido de nuevo a Angel's Beauty</p>

    <!-- Mensaje de error si las credenciales son incorrectas -->
    <div th:if="${error != null}" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem;">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/login}" method="POST" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
        <div>
            <label style="font-weight: bold; font-size: 0.9rem;">Correo electrónico</label>
            <input type="email" name="email" required placeholder="ejemplo@correo.com"
                   style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;">
        </div>

        <div>
            <label style="font-weight: bold; font-size: 0.9rem;">Contraseña</label>
            <input type="password" name="password" required placeholder="Ingresa tu contraseña"
                   style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;">
        </div>

        <button type="submit" class="cta-btn" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">
            Entrar
        </button>
    </form>

    <!-- Enlace hacia el Registro de Clientes -->
    <p style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
        ¿Aún no tienes cuenta? <a th:href="@{/registro}" style="color: #FF1694; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
    </p>
</section>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Angel's Beauty - Resalta tu brillo natural.</p>
</footer>

</body>
</html>
