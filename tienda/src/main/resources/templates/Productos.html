<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto | Angel's Beauty</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="login-body">

<nav class="navbar">
    <a th:href="@{/}" class="logo">Angel's Beauty (Panel Admin)</a>
    <ul class="nav-links">
        <li><a th:href="@{/}">Volver a la Tienda</a></li>
        <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
    </ul>
</nav>

<div class="login-container">
    <div class="login-card" style="max-width: 500px;">
        <h1>Nuevo Producto</h1>
        <p class="login-subtitle">Añade un nuevo ítem al catálogo</p>

        <form th:action="@{/admin/productos/guardar}" method="POST" class="login-form">
            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Labial Velvet Pink">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Acabado mate de larga duración">
            </div>

            <div class="form-group">
                <label for="precio">Precio ($)</label>
                <input type="number" step="0.01" id="precio" name="precio" required placeholder="19.99">
            </div>

            <div class="form-group">
                <label for="stock">Stock Disponible</label>
                <input type="number" id="stock" name="stock" required placeholder="10">
            </div>

            <div class="form-group">
                <label for="imagen">URL de la Imagen</label>
                <input type="text" id="imagen" name="imagen" placeholder="https://..." required>
            </div>

            <button type="submit" class="cta-btn login-btn">Guardar Producto</button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 Angel's Beauty - Panel Administrativo</p>
</footer>

</body>
</html>
